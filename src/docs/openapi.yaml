openapi: 3.2.1
info: 
  title: Todo REST API
  version: 0.0.1
  description: An API for managing todo tickets. Supports CRUD operations, adding todo item, filtering by state, updating items by id, deleting by id


servers:
  - url: http://localhost:3000
    description: My local development server.
    

paths:
  /auth:
    post:
      tags: [Authentication]
      summary: Authenticate user Login and retrieve access token
      description: Authenticates a user and returns access token and stores a refresh token . Copy returned accessToken and use it in top of swagger ui

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login successful
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse' 
        '401':
          description: Invalid credentials
          
        '429':
          description: Too many requests. Rate limit exceeded.

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: New access token 
      description: Generate a new access token using valid refresh token
      responses:
        '200':
          description: new access token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          
        '401':
          description: Invalid or expired refresh token
        '429':
          description: Too many requests. Rate limit exceeded.


  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Makes the current refresh token invalid
      responses:
        '200':
          description: Logged out successfully
        '429':
          description: Too many requests. Rate limit exceeded.




  /todos:
    get:
      tags: [Todos]
      security:
       - bearerAuth: []
      parameters:
      - name: state
        in: query
        required: false
        description: Filter todo items by state
        schema:
          $ref: '#/components/schemas/TodoState'
      produces: ['application/json', 'text/csv']
      summary: Get all todos, or filter by state 
      responses:
        '200':
          description: List of Todo items.
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoItem'
            text/csv:
              schema:
                type: string
              example: |
                id,title,state,createdAt,modifiedAt
                6d92c56b-1b14-4a24-935d-b99e494a3106,"Study REST APIs","Read a dissertation by Roy Fielding ",todo,2026-11-24T09:00:00Z,2026-11-24T09:15:00Z
        '401':
          description: Access token is missing or invalid
        '429':
          description: Too many requests. Rate limit exceeded.                
    post:
      tags: [Todos]
      security:
        - bearerAuth: []
      produces: ['application/json', 'text/csv']
      summary: Add a new todo item to list of todos
      description: Creates a new todo item 
      operationId: addNewToDo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  example: Assignment 6 documentation
                description:
                  type: string
                  example: Learn swagger and openAPI documentation syntax 
                state:
                  $ref: '#/components/schemas/TodoState'
      
      responses:
        '201':
          description: todo item added successfully
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem' 
        '400':
          description: todo title missing or invalid title
        '401':
          description: Access token is missing or invalid
        '429':
          description: Too many requests. Rate limit exceeded. 

  /todos/{id}:  
    get:
      tags: [Todos]
      security:
        - bearerAuth: []
      produces: ['application/json', 'text/csv']
      summary: Find a todo item by Id if it exists
      description: Returns a single todo item
      operationId: getToDoById
      parameters:
        - name: id
          in: path
          description: id of todo item 
          required: true
          schema:
            type: string
            
      responses:
        '200':
          description: Todo item found -successful operation
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem' 
        '404':
          description: ToDo item NOT found - unsuccessful
        '401':
          description: Access token is missing or invalid
        '429':
          description: Too many requests. Rate limit exceeded. 
    put:
        tags: [Todos]
        security:
          - bearerAuth: []
        produces : ['application/json', 'text/csv']
        summary: Update todo item
        description: Can update existing todo item
        operationId: updateTodo

        parameters:
          - name: id
            in: path
            description: id of todo item that needs to be updated
            required: true 
            schema:
              type: string

        requestBody:
          description: Update content 
          required: true 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem'
          
        responses:
          '200':
            description: Todo item found and updated successfully
            content: 
              application/json:
                schema:
                  $ref: '#/components/schemas/TodoItem' 
          '400':
            description: Incorrect format - unsuccessful
        
          '404':
            description: ToDo item NOT found - unsuccessful
          '401':
            description: Access token is missing or invalid
          '429':
            description: Too many requests. Rate limit exceeded. 

    delete:
        tags: [Todos]
        security: 
        - bearerAuth: []
        produces : ['application/json', 'text/csv']
        summary: Delete todo item
        description: Delete todo item by id it item exists
        operationId: deleteTodo

        parameters:
          - name: id
            in: path
            description: id of todo item to be deleted
            required: true 
            schema:
              type: string

      
          
        responses:
          '200':
            description: Todo item found and deleted successfully 

          '404':
            description: ToDo item NOT found - unsuccessful
          '401':  
            description: Access token is missing or invalid
          '429':
            description: Too many requests. Rate limit exceeded. 

components:
  securitySchemes: 
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

      description: |
        steps:
        1) call POST / auth with a valid username and password.
        2) copy the access_token returned in the response.
        3) click authorize button at the top of ui
        4) paste the access token into the value field
        5) click authorize
        NOTE: 
        Enter only token value
        Do not include the word "Bearer"
        Example:
        euy433485935853...

  

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: TestTom
        password:
          type: string
          example: test 
    TodoState:
      type: string 
      description: current state of the Todo items
      enum:
        - todo
        - doing
        - done
    AuthResponse:
      type: object
      properties:
        user:
          type: string
          example: TestTom
        access_token:
          type: string
          

        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 30
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          

        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 30
    TodoItem:
        type: object
        required:
          - id
          - title
          - state
          - createdAt
          - modifiedAt
        properties:
          id:
            type: string
            readOnly: true 
            example: "1234567890"
          title:
            type: string 
            minLength: 1
            example: Write your first OAD 
          state:
            $ref: '#/components/schemas/TodoState'
          createdAt:
            type: string
            example: "2026-11-24T09:00:00Z"
          modifiedAt:
            type: string
            example: "2026-11-24T09:30:00Z"


