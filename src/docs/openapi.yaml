openapi: 3.2.1
info: 
  title: Todo REST API
  version: 0.0.1
  description: An API for managing todo tickets. Supports CRUD operations and filtering by state


servers:
  - url: http://localhost:3000
    description: My local development server.
    

paths:
  /todos:
    get:
      tags: [Todos]
      parameters:
      - name: state
        in: query
        required: false
        description: Filter todo items by state
        schema:
          $ref: '#/components/schemas/TodoState'
      produces: ['application/json', 'text/csv']
      summary: Get all todos, or filter by state 
      responses:
        '200':
          description: List of Todo items.
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoItem'
  /todos/{id}:  
    get:
      tags: [todo]
      produces: ['application/json', 'text/csv']
      summary: Find a todo item by Id if it exists
      description: Returns a single todo item
      operationId: getToDoById
      parameters:
        - name: id
          in: path
          description: id of todo item 
          required: true
          schema:
            type: string
            
      responses:
        '200':
          description: Todo item found -successful operation
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/TodoItem' 
        '404':
          description: ToDo item NOT found - unsuccessful

  
components:
  schemas:
    TodoState:
      type: string 
      description: current state of the Todo items
      enum:
        - todo
        - doing
        - done

    TodoItem:
        type: object
        required:
          - id
          - title
          - state
          - createdAt
          - modifiedAt
        properties:
          id:
            type: string
            readOnly: true 
            example: "1234567890"
          title:
            type: string 
            minLength: 1
            example: Write your first OAD 
          state:
            $ref: '#/components/schemas/TodoState'
          createdAt:
            type: string
            example: "2026-11-24T09:00:00Z"
          modifiedAt:
            type: string
            example: "2026-11-24T09:30:00Z"


